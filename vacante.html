<!DOCTYPE html>
<html lang="es-EC">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacante de empleo en Ecuador · TalentoEC</title>
<meta name="description" content="Vacante publicada por una empresa ecuatoriana en TalentoEC. Postula con tu CV en un clic.">
<meta name="theme-color" content="#1BD07F">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TalentoEC">
<meta property="og:image" content="https://talentoec.com/talentoec-og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--fondo:#09100D;--tarjeta:#161C19;--claro:#EEF7F2;--suave:rgba(238,247,242,.65);--linea:rgba(238,247,242,.1);--verde:#1BD07F}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--fondo);color:var(--claro);min-height:100vh;line-height:1.6}
  a{color:var(--verde)}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px clamp(16px,4vw,40px);border-bottom:1px solid var(--linea)}
  .logo{font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--claro);text-decoration:none;display:flex;align-items:center;gap:8px}
  .logo span{background:var(--verde);color:var(--fondo);font-size:9px;font-weight:800;padding:2px 7px;border-radius:999px;letter-spacing:.05em}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;font:700 15px 'Plus Jakarta Sans',sans-serif;padding:14px 26px;cursor:pointer;text-decoration:none;min-height:48px}
  .btn-verde{background:var(--verde);color:var(--fondo)}
  .btn-borde{background:transparent;color:var(--claro);border:1px solid var(--linea)}
  main{max-width:820px;margin:0 auto;padding:clamp(28px,5vw,56px) 16px 80px}
  .migas{font-size:13px;color:var(--suave);margin-bottom:18px}
  .migas a{color:var(--suave)}
  .tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:24px;padding:clamp(22px,4vw,36px)}
  .chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--fondo);background:var(--verde);padding:4px 10px;border-radius:999px;margin-bottom:14px}
  h1{font-size:clamp(26px,4.2vw,38px);line-height:1.15;letter-spacing:-.03em;margin-bottom:8px;overflow-wrap:anywhere}
  .empresa{font-size:17px;font-weight:600;color:var(--suave);margin-bottom:18px;overflow-wrap:anywhere}
  .datos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .datos span{font-size:13px;background:rgba(238,247,242,.06);border:1px solid var(--linea);border-radius:999px;padding:6px 12px}
  .desc{white-space:pre-wrap;color:rgba(238,247,242,.85);margin-bottom:26px;overflow-wrap:anywhere}
  .acciones{display:flex;gap:10px;flex-wrap:wrap}
  .nota{font-size:12.5px;color:var(--suave);margin-top:16px}
  .estado{text-align:center;padding:60px 20px;color:var(--suave)}
  .estado b{display:block;font-size:20px;color:var(--claro);margin:10px 0 6px}
  footer{text-align:center;font-size:12px;color:var(--suave);padding:24px 16px;border-top:1px solid var(--linea)}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">TalentoEC <span>ECUADOR</span></a>
  <a class="btn btn-borde" href="/empleos.html" style="padding:10px 18px;min-height:40px;font-size:13px">Ver todas las vacantes</a>
</header>
<main>
  <div class="migas"><a href="/">Inicio</a> › <a href="/empleos.html">Empleos</a> › <span id="migaCargo">Vacante</span></div>
  <div id="contenido" class="estado" role="status">Cargando la vacante…</div>
</main>
<footer>TalentoEC by Proyectart · Vacantes publicadas directamente por empresas ecuatorianas</footer>
<script>
(function () {
  var API = 'https://talentoec-backend-production.up.railway.app/api/auth';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var id = new URLSearchParams(location.search).get('id') || '';
  var caja = document.getElementById('contenido');
  function noDisponible(msg) {
    caja.className = 'estado';
    caja.innerHTML = '<div style="font-size:40px">📭</div><b>' + esc(msg || 'Esta vacante ya no está disponible') + '</b>Mira otras vacantes publicadas por empresas en TalentoEC.<div style="margin-top:20px"><a class="btn btn-verde" href="/empleos.html">Ver vacantes</a></div>';
    var r = document.createElement('meta'); r.name = 'robots'; r.content = 'noindex'; document.head.appendChild(r);
  }
  if (!/^[\w-]{1,64}$/.test(id)) { noDisponible('No encontramos esta vacante'); return; }
  fetch(API + '/vacantes/publica/' + encodeURIComponent(id)).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok || !res.j || !res.j.vacante) { noDisponible(res.j && res.j.error); return; }
      var v = res.j.vacante;
      var remoto = /remot/i.test(v.modalidad || '');
      document.title = v.cargo + ' en ' + v.ciudad + ' — ' + v.empresa + ' · TalentoEC';
      var d = document.querySelector('meta[name="description"]');
      d.content = (v.cargo + ' en ' + v.empresa + ', ' + v.ciudad + '. ' + String(v.descripcion || '').replace(/\s+/g, ' ')).slice(0, 155);
      var can = document.createElement('link'); can.rel = 'canonical'; can.href = 'https://talentoec.com/vacante.html?id=' + encodeURIComponent(v.id); document.head.appendChild(can);
      document.getElementById('migaCargo').textContent = v.cargo;
      var publicada = new Date(v.publicada);
      var dias = Math.max(0, Math.floor((Date.now() - publicada.getTime()) / 86400000));
      caja.className = 'tarjeta';
      caja.innerHTML =
        '<div class="chip">⭐ EXCLUSIVO TALENTOEC · ENVÍO DIRECTO</div>' +
        '<h1>' + esc(v.cargo) + '</h1>' +
        '<div class="empresa">' + esc(v.empresa) + '</div>' +
        '<div class="datos"><span>📍 ' + esc(v.ciudad) + '</span><span>💼 ' + esc(v.modalidad || 'Presencial') + '</span><span>💰 ' + esc(v.salario || 'A convenir') + '</span><span>🕒 ' + (dias === 0 ? 'Publicada hoy' : dias === 1 ? 'Publicada ayer' : 'Publicada hace ' + dias + ' días') + '</span></div>' +
        '<div class="desc">' + esc(v.descripcion) + '</div>' +
        '<div class="acciones"><a class="btn btn-verde" href="/?vacante=' + encodeURIComponent(v.id) + '&q=' + encodeURIComponent(v.cargo) + '">📄 Postular con mi CV</a><a class="btn btn-borde" href="/empleos.html">Ver más vacantes</a></div>' +
        '<div class="nota">Tu CV llega directo al correo de la empresa. Crear tu cuenta en TalentoEC toma un minuto.</div>';
      // Datos estructurados para Google Empleos (solo vacantes reales y vigentes de la bolsa propia)
      if (v.vigenteGoogle) {
        var ld = {
          '@context': 'https://schema.org/', '@type': 'JobPosting',
          title: v.cargo,
          description: '<p>' + esc(v.descripcion).replace(/\n+/g, '</p><p>') + '</p>',
          datePosted: v.publicada.slice(0, 10),
          validThrough: v.vence,
          hiringOrganization: { '@type': 'Organization', name: v.empresa },
          identifier: { '@type': 'PropertyValue', name: 'TalentoEC', value: String(v.id) },
          directApply: true
        };
        if (remoto) {
          ld.jobLocationType = 'TELECOMMUTE';
          ld.applicantLocationRequirements = { '@type': 'Country', name: 'Ecuador' };
        } else {
          ld.jobLocation = { '@type': 'Place', address: { '@type': 'PostalAddress', addressLocality: v.ciudad, addressCountry: 'EC' } };
        }
        if (v.empresa_logo && /^https:\/\//.test(v.empresa_logo)) ld.hiringOrganization.logo = v.empresa_logo;
        var m = String(v.salario || '').replace(/[.,](?=\d{3}\b)/g, '').match(/\d{3,5}/);
        if (m && !/convenir/i.test(v.salario)) ld.baseSalary = { '@type': 'MonetaryAmount', currency: 'USD', value: { '@type': 'QuantitativeValue', value: Number(m[0]), unitText: 'MONTH' } };
        var s = document.createElement('script'); s.type = 'application/ld+json'; s.id = 'jobposting';
        s.textContent = JSON.stringify(ld).replace(/</g, '\\u003c');
        document.head.appendChild(s);
      }
    })
    .catch(function () { noDisponible('No pudimos cargar la vacante. Intenta de nuevo en un momento.'); });
})();
</script>
</body>
</html>
